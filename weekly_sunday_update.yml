name: Weekly Sunday HedgeFund & Options Flow Update

on:
  schedule:
    # 매주 일요일 오전 09:00 KST (UTC 00:00) 자동 실행
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  weekly-flow-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run weekly price + options flow + SEC 13F updater
        run: |
          python update_weekly.py

      - name: Commit and push updated Excel & PPTX to GitHub
        run: |
          git config --local user.email "ilsan-wm-bot@users.noreply.github.com"
          git config --local user.name "MiraeAsset-IlsanWM-Bot"
          git add output/
          git commit -m "chore(weekly): auto-update returns, options flow & 13F data" || exit 0
          git push
